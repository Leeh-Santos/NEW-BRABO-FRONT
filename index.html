<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040e1c" />

    <title>Brabo Markets — Fund with ETH, receive $BRB on Base</title>
    <meta
      name="description"
      content="Brabo Markets ($BRB) — fund with ETH, receive $BRB instantly, and unlock NFT tier bonuses on Base."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brabo Markets — DeFi funding on Base" />
    <meta
      property="og:description"
      content="Fund with ETH, receive $BRB instantly, and unlock NFT tier bonuses."
    />
    <meta property="og:image" content="/brand/brabo-og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The splash below shows this instantly; without the hint it would only
         start downloading once the inline CSS is parsed. -->
    <link rel="preload" as="image" href="/brand/brabo-bull-128.png" />

    <!-- Boot splash. Inline and dependency-free so the very first paint is the
         brand rather than a white flash or an empty navy rectangle. main.tsx
         fades it out the frame after React commits. -->
    <style>
      /* Boot splash: inline, dependency-free, so the first paint is the brand
         rather than a blank rectangle while the wallet SDK parses. Set in the
         system stack because Geist ships inside the bundle and isn't available
         yet at this point. main.tsx fades this out once React commits. */
      html { background: #040e1c; }
      body { margin: 0; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: #040e1c;
        transition: opacity 360ms cubic-bezier(0.16, 1, 0.3, 1), visibility 360ms;
      }
      #boot.boot-hide { opacity: 0; visibility: hidden; }
      #boot img {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      #boot .wm {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #627893;
      }
      #boot .bar {
        width: 112px;
        height: 1px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #38c0f8;
        animation: boot-scan 1.1s ease-in-out infinite;
      }
      @keyframes boot-scan {
        from { transform: translateX(-100%); }
        to   { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="/brand/brabo-bull-128.png" width="72" height="72" alt="Brabo Markets" />
      <div class="wm">brabo markets</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
